repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.2
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.6.0-2
    hooks:
      - id: shfmt
        args: [-w, -s, -i=4]

  # fork: 研究ツールとテストだけ ruff（check のみ、修正はしない）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--no-fix]
        files: ^(aichallenge/research_tools/.*\.py|aichallenge/workspace/src/aichallenge_submit/multi_purpose_mpc_ros/test/test_mpc_core\.py)$
